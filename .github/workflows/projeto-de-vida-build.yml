name: Projeto de Vida · build
on:
  push:
    branches:
      - projeto-de-vida
  pull_request:
    branches:
      - projeto-de-vida
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
