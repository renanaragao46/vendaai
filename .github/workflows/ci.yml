name: VendaAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --no-save
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Format workspace
        run: bunx prettier --write .
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build

  gateway:
    name: Validate WhatsApp Web Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: whatsapp-gateway/package.json
      - name: Install gateway dependencies
        run: npm install --omit=dev
      - name: Syntax check
        run: node --check server.mjs

  edge:
    name: Validate AI Edge Function
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck AI Sales Engine
        run: deno check --minimum-dependency-age 0 supabase/functions/ai-sales-engine/index.ts
      - name: Typecheck WhatsApp Webhook
        run: deno check --minimum-dependency-age 0 supabase/functions/whatsapp-webhook/index.ts
      - name: Typecheck WhatsApp Connect
        run: deno check --minimum-dependency-age 0 supabase/functions/whatsapp-connect/index.ts
