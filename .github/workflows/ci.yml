name: Projeto de Vida CI

on:
  push:
    branches: [projeto-de-vida]
  pull_request:
    branches: [projeto-de-vida]
  workflow_dispatch:

jobs:
  build:
    name: Install and build Projeto de Vida
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
