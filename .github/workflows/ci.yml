name: Projeto de Vida CI

on:
  push:
    branches: [projeto-de-vida]
  pull_request:
    branches: [projeto-de-vida]
  workflow_dispatch:

jobs:
  build:
    name: Install and build Projeto de Vida
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies from bun.lock
        run: bun install --no-save
      - name: Type-check TypeScript
        run: bunx tsc --noEmit
      - name: Build application
        run: bun run build
